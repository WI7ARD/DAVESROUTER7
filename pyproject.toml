[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pcb-router"
# PEP 440 cannot express "0.1.0-stage1"; "+stage1" is the equivalent local
# version label. The user-facing version string lives in pcbrouter.__version__.
version = "0.1.0+stage1"
description = "Desktop PCB inspection and (future) AI-assisted autorouting for KiCad boards."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Davi" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "PySide6>=6.6",
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "black>=24",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
pcbrouter = "pcbrouter.app.application:main"

[project.gui-scripts]
pcbrouter-gui = "pcbrouter.app.application:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pcbrouter = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "N",   # pep8-naming
    "T20", # no print() in library code
    "RUF",
]
ignore = [
    "N802", # Qt overrides such as mousePressEvent must keep Qt's camelCase names
]
# Deliberate typography in user-facing strings (dimensions "30 × 20 mm", dashes).
allowed-confusables = ["×", "–"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"tools/**" = ["T20"]
"src/pcbrouter/app/cli.py" = ["T20"]
# Qt signals follow Qt's camelCase naming (e.g. objectSelected), matching the Qt API.
"src/pcbrouter/ui/**" = ["N815"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["pcbrouter"]
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pcbrouter.ui.*"]
# PySide6 stubs expose many overloaded/untyped signal attributes.
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["tests.*"]
# pytest-qt's QtBot methods are unannotated.
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "gui: tests that construct Qt widgets (run with QT_QPA_PLATFORM=offscreen in CI)",
]
qt_api = "pyside6"
